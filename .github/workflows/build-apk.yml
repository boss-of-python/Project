name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - "android/**"
      - "thans/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: build debug APK (buildozer)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-sdk-${{ runner.os }}-ubuntu2204-api33-ndk25b-arm64-v4

      - name: Install system deps + buildozer
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git zip unzip \
            autoconf automake libtool libtool-bin pkg-config \
            cmake build-essential ccache patch lld \
            libffi-dev libssl-dev zlib1g-dev \
            libncurses-dev libncursesw5-dev \
            unzip zip
          python -m pip install --upgrade pip "setuptools<70" wheel virtualenv
          python -m pip install "cython==0.29.36" "buildozer==1.5.0"
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"

      - name: Run core & UI test suite
        run: python -m thans --selftest

      - name: Stage core package and build debug APK
        working-directory: android
        env:
          ANDROIDSDK: ""
        run: |
          unset ANDROID_NDK GRADLE_HOME ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROIDSDK ANDROIDNDK
          chmod +x stage_thans.sh
          ./stage_thans.sh
          set +e
          buildozer -v android debug 2>&1 | tee buildozer.out
          rc=${PIPESTATUS[0]}
          set -e
          tail -n 80 buildozer.out
          if [ "$rc" != "0" ]; then
            echo "::error::buildozer failed (rc=$rc)"
            # Surface the actual error in the Checks annotations (logs are not
            # downloadable from some environments).
            grep -iE 'error:|traceback|exception:|command failed|stderr:' buildozer.out | tail -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "----- last 40 lines -----" >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 buildozer.out >> "$GITHUB_STEP_SUMMARY"
            ls -la bin || true
            exit "$rc"
          fi
          ls -lh bin/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: thans-android
          path: android/bin/*.apk
          if-no-files-found: error

      - name: Auto-commit built APK to releases/THANS-android.apk
        run: |
          mkdir -p releases
          cp -f android/bin/*.apk releases/THANS-android.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/THANS-android.apk
          if git diff --cached --quiet; then
            echo "releases/THANS-android.apk is already up to date"
          else
            git commit -m "chore(android): commit built APK to releases/THANS-android.apk [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi
