name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "thans/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    name: build debug APK (buildozer)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps + buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev \
            gettext patch ccache python3-pip python3-venv
          python -m pip install --upgrade pip setuptools wheel virtualenv
          python -m pip install "cython<3" buildozer packaging toml sh colorama appdirs jinja2

      - name: Run core test suite
        run: python -m thans --selftest

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x stage_thans.sh
          ./stage_thans.sh
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: thans-android
          path: android/bin/*.apk
          if-no-files-found: error
