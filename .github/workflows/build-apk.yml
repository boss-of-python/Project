name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "thans/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    name: build debug APK (buildozer)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    # Official Kivy image: buildozer + JDK 17 + full toolchain preinstalled,
    # so we skip the apt-get/pip setup steps (saves ~4-7 min per run).
    container:
      image: kivy/buildozer:latest
      options: --user root
    env:
      # Buildozer stores SDK/NDK under $HOME/.buildozer — pin HOME so the
      # actions/cache path below is deterministic.
      HOME: /home/user

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # auto-commit step rebases & pushes the built APK

      - name: Cache Buildozer global directory (Android SDK + NDK + p4a)
        uses: actions/cache@v4
        with:
          path: /home/user/.buildozer
          key: bz-p4a-${{ runner.os }}-container-v1
          restore-keys: |
            bz-p4a-${{ runner.os }}-container-v1

      - name: Run core & UI test suite
        run: /home/user/.venv/bin/python -m thans --selftest

      - name: Stage core package and build debug APK
        working-directory: android
        run: |
          unset ANDROID_NDK GRADLE_HOME ANDROID_NDK_HOME ANDROID_NDK_ROOT
          chmod +x stage_thans.sh
          ./stage_thans.sh
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: thans-android
          path: android/bin/*.apk
          if-no-files-found: error

      - name: Auto-commit built APK to releases/THANS-android.apk
        run: |
          mkdir -p releases
          cp -f android/bin/*.apk releases/THANS-android.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/THANS-android.apk
          if git diff --cached --quiet; then
            echo "releases/THANS-android.apk is already up to date"
          else
            git commit -m "chore(android): commit built APK to releases/THANS-android.apk [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi
