name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "thans/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    name: build debug APK (buildozer)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps + buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config python3-pip
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Run core test suite
        run: python -m thans --selftest

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x stage_thans.sh
          ./stage_thans.sh
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: thans-android
          path: android/bin/*.apk
          if-no-files-found: error
