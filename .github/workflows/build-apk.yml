name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - "android/**"
      - "thans/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "thans/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: build debug APK (buildozer)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-sdk-${{ runner.os }}-ubuntu2204-api33-ndk25b-v3

      - name: Install system deps + buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin pkg-config \
            cmake build-essential ccache patch lld \
            libffi-dev libssl-dev zlib1g-dev \
            libncurses-dev libncurses5-dev libncursesw5-dev libtinfo5 python3-pip
          python -m pip install --upgrade pip "setuptools<70" wheel virtualenv
          python -m pip install "cython==0.29.36" "buildozer==1.5.0"

      - name: Run core & UI test suite
        run: python -m thans --selftest

      - name: Stage core package and build debug APK
        working-directory: android
        run: |
          unset ANDROID_NDK GRADLE_HOME ANDROID_NDK_HOME ANDROID_NDK_ROOT
          chmod +x stage_thans.sh
          ./stage_thans.sh
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: thans-android
          path: android/bin/*.apk
          if-no-files-found: error

      - name: Auto-commit built APK to releases/THANS-android.apk
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p releases
          cp -f android/bin/*.apk releases/THANS-android.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/THANS-android.apk
          if git diff --cached --quiet; then
            echo "releases/THANS-android.apk is already up to date"
          else
            git commit -m "chore(android): commit built APK to releases/THANS-android.apk [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          fi
